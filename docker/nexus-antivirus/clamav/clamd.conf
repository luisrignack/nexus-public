# clamd configuration for the Nexus antivirus sidecar.
LogFile /var/log/clamav/clamd.log
PidFile /var/run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav

# Escucha en TCP dentro de la red de docker-compose; no se publica en el host.
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock

MaxThreads 4
MaxQueue 100
SelfCheck 3600
MaxFileSize 200M
AlertExceedsMax yes
