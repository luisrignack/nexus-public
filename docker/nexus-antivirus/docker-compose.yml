name: nexus-fork-antivirus

services:
  nexus:
    build:
      context: ../..
      dockerfile: docker/nexus-antivirus/Dockerfile
    image: ${NEXUS_IMAGE:-nexus-fork:3.98.1-01-local}
    container_name: nexus-fork
    restart: unless-stopped
    ports:
      - "${NEXUS_HTTP_PORT:-8081}:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: >-
        -Xms${NEXUS_XMS:-1g} -Xmx${NEXUS_XMX:-2g}
        -Djava.net.preferIPv4Stack=true
      NEXUS_CACHEBUSTER: ${NEXUS_CACHEBUSTER:-docker-1}
      MALWARE_BRIDGE_URL: ${MALWARE_BRIDGE_URL:-http://malware-bridge:8082/scan}
      NEXUS_MALWARE_ENABLED: "${NEXUS_MALWARE_ENABLED:-true}"
      NEXUS_MALWARE_ON_UPLOAD: "${NEXUS_MALWARE_ON_UPLOAD:-true}"
      NEXUS_MALWARE_DELETE_INFECTED: "${NEXUS_MALWARE_DELETE_INFECTED:-false}"
      MAX_SCAN_BYTES: "${MAX_SCAN_BYTES:-209715200}"
      # Datastore PostgreSQL (el source de entorno tiene prioridad sobre H2 embebido)
      NEXUS_DATASTORE_NEXUS_JDBCURL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nexus}"
      NEXUS_DATASTORE_NEXUS_USERNAME: "${POSTGRES_USER:-nexus}"
      NEXUS_DATASTORE_NEXUS_PASSWORD: "${POSTGRES_PASSWORD:-nexus}"
      NEXUS_DATASTORE_NEXUS_SCHEMA: "${POSTGRES_SCHEMA:-public}"
      NEXUS_DATASTORE_NEXUS_ADVANCED: "${NEXUS_DATASTORE_ADVANCED:-maximumPoolSize=20}"
    volumes:
      - nexus-data:/nexus-data
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      malware-bridge:
        condition: service_healthy
    networks:
      - nexus-net

  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:15-alpine}
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexus-net

  clamav:
    image: ${CLAMAV_IMAGE:-docker.m.daocloud.io/clamav/clamav:1.4.7-debian}
    container_name: nexus-clamav
    restart: unless-stopped
    environment:
      CLAMD_START_IF_LOCAL: "1"
      FRESHCLAM_START_IF_LOCAL: "1"
    volumes:
      - clamav-db:/var/lib/clamav
      - clamav-log:/var/log/clamav
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3310 && printf 'PING\\n' >&3 && IFS= read -r line <&3 && [ \"$$line\" = PONG ]"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - nexus-net

  malware-bridge:
    build:
      context: ./malware-bridge
      dockerfile: Dockerfile
    image: ${BRIDGE_IMAGE:-nexus-malware-bridge:local}
    container_name: nexus-malware-bridge
    restart: unless-stopped
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MAX_SCAN_BYTES: "${MAX_SCAN_BYTES:-209715200}"
      BRIDGE_PORT: "8082"
      SCAN_ENGINE: "${SCAN_ENGINE:-clamav}"
      KASPERSKY_SCAN_CMD: "${KASPERSKY_SCAN_CMD:-kavscan --scan-file {file}}"
      KASPERSKY_CMD_TIMEOUT: "${KASPERSKY_CMD_TIMEOUT:-120}"
      KASPERSKY_API_URL: "${KASPERSKY_API_URL:-}"
      KASPERSKY_TOKEN: "${KASPERSKY_TOKEN:-}"
      KASPERSKY_TOKEN_FILE: "${KASPERSKY_TOKEN_FILE:-}"
      KASPERSKY_VERIFY_TLS: "${KASPERSKY_VERIFY_TLS:-true}"
      # Para Kaspersky CLI con licencia local, descomenta y ajusta la ruta del binario/licencia:
      # - ./kaspersky:/opt/kaspersky:ro
    ports:
      - "127.0.0.1:${MALWARE_BRIDGE_PORT:-8082}:8082"
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - nexus-net

volumes:
  nexus-data:
  postgres-data:
  clamav-db:
  clamav-log:

networks:
  nexus-net:
    driver: bridge
